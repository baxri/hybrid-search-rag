[project]
name = "hybrid-search-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.15",
    "cohere>=7.3.0",
    "fastapi>=0.161.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic-ai-slim[openai]>=2.60.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
